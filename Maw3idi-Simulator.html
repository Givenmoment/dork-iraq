<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محاكي موعدي الاحترافي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827;color:#fff;font-family:Tahoma,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px;background:#172033;border-bottom:1px solid #344057}.toolbar strong{margin-left:14px}.toolbar button{border:1px solid #485570;background:#222d43;color:#dce5f7;padding:9px 13px;border-radius:10px;cursor:pointer}.toolbar button.active{background:#2f6fed;border-color:#6d9aff;color:white}.stage{display:grid;place-items:center;padding:22px;overflow:auto;background:radial-gradient(circle,#2a3853,#101724)}.device{width:393px;height:852px;max-height:calc(100vh - 95px);background:#000;border:10px solid #2a3140;border-radius:48px;padding:0;box-shadow:0 25px 70px #0009;overflow:hidden;transition:.25s}.device.android{width:412px;height:915px;border-radius:28px;border-width:7px}.device.tablet{width:768px;height:900px;border-radius:24px;border-width:8px}.device.full{width:min(1100px,100%);height:calc(100vh - 105px);border-radius:16px;border-width:4px}.device.landscape{width:852px;height:393px}.device iframe{width:100%;height:100%;border:0;background:#f7f7f5}@media(max-width:650px){.toolbar strong{width:100%;text-align:center}.stage{padding:0}.device,.device.android,.device.tablet,.device.full,.device.landscape{width:100%;height:calc(100vh - 105px);max-height:none;border:0;border-radius:0}}</style></head><body><header class="toolbar"><strong>محاكي موعدي</strong><button class="active" onclick="setDevice(this,'iphone')">iPhone 15</button><button onclick="setDevice(this,'android')">Android</button><button onclick="setDevice(this,'tablet')">Tablet</button><button onclick="setDevice(this,'full')">عرض كامل</button><button onclick="rotate()">↻ تدوير</button><button onclick="reloadApp()">⟳ تحديث</button></header><main class="stage"><div class="device" id="device"><iframe id="app" src="Kassa-V3-iPhone-PC.html" title="تطبيق موعدي"></iframe></div></main><script>let current='iphone';function setDevice(b,type){current=type;document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#device').className='device '+(type==='iphone'?'':type)}function rotate(){let d=document.querySelector('#device');d.classList.toggle('landscape')}function reloadApp(){document.querySelector('#app').contentWindow.location.reload()}</script></body></html>
